# UgaJapa Translation API — Render Blueprint (FREE tier)
# Repo: https://github.com/Se-babe/Ugajapa-Bot
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Se-babe/Ugajapa-Bot
#
# Free tier: translation-api + postgres only (~$0/mo).
# Groq + Google engines handle all translations (no NLLB bot — needs paid RAM).
# Set GROQ_API_KEY, GOOGLE_API_KEY, ADMIN_PASSWORD on the review screen.

databases:
  - name: ugajapa-postgres
    databaseName: ugajapa_api
    plan: free
    region: oregon

services:
  # Public Translation API + dashboard
  - type: web
    name: translation-api
    runtime: docker
    dockerfilePath: ./translation-api/Dockerfile
    dockerContext: ./translation-api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ugajapa-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BILLING_CRON_SECRET
        generateValue: true
      - key: TRANSLATION_CACHE_TTL_SECONDS
        value: "3600"
      - key: TRANSLATION_CACHE_MAX_ENTRIES
        value: "10000"
      - key: DETECT_CACHE_TTL_SECONDS
        value: "3600"
      - key: BACK_TRANSLATION_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        value: xwalesebabe@gmail.com
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
