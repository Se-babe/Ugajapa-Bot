<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UgaJapa — Translation API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <script>
    // Portal runs on port 5000 — redirect if opened on wrong port (e.g. 3000 = Mattermost)
    if (location.hostname === "localhost" && location.port && location.port !== "5000") {
      location.replace("http://localhost:5000" + location.pathname + location.search + location.hash);
    }
  </script>
  <div id="app">
    <div style="display:grid;place-items:center;min-height:100vh;color:#94a3b8;font-family:Inter,system-ui,sans-serif">
      Loading…
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
