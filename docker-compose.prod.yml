# UgaJapa Translation API — PRODUCTION Docker Compose
#
# For self-hosting on your own server (VPS, on-prem, etc.) — not needed for
# the Render deployment, which is configured separately via render.yaml.
#
# Differences from docker-compose.yml (local development):
#   - NODE_ENV=production, DATABASE_SSL=false (private Docker network, no
#     SSL cert on this Postgres — safe since it's never exposed externally)
#   - Postgres and the bot have NO host port mapping at all — only reachable
#     from other containers on this compose network, never from the host
#     or the internet
#   - translation-api is bound to 127.0.0.1 only, not 0.0.0.0 — put a
#     reverse proxy (NGINX, Caddy, Cloudflare Tunnel, etc.) in front of it
#     to terminate TLS and expose it to the internet. Do not point a public
#     IP directly at port 5000 without one.
#   - All secrets come from .env.prod (gitignored) via each service's own
#     env_file — deliberately NOT via ${VAR} interpolation in this YAML,
#     which Compose would instead resolve from a root .env file (the local
#     dev secrets file), silently pulling the wrong credentials.
#
# Usage:
#   cp .env.prod.example .env.prod   # then fill in real values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# --env-file .env.prod matters here (not just `docker compose -f ...`): it's
# what makes the ${API_PORT}/${BOT_HOST_PORT} substitutions below resolve
# from .env.prod instead of a root .env file. Every secret already comes in
# through env_file regardless, so this only affects host port mapping.
#
# Schema migrations run automatically on boot (ensureSchema() in seed.ts) —
# no manual database setup step needed, including on first deploy.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ugajapa-postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - ugajapa_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ugajapa-bot:
    build: ./ugajapa-bot
    container_name: ugajapa-bot
    restart: always
    volumes:
      - ugajapa_model_cache_prod:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  translation-api:
    build: ./translation-api
    container_name: ugajapa-translation-api
    restart: always
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    env_file:
      - .env.prod
    environment:
      # DATABASE_URL, POSTGRES_*, and every secret come from .env.prod
      # (see the note above on why these aren't ${...} interpolated here).
      # Only wiring specific to running inside this compose network goes here.
      NODE_ENV: production
      PORT: 5000 # container-internal port; set API_PORT in .env.prod to remap the host side
      DATABASE_SSL: "false"
      BOT_URL: http://ugajapa-bot:8000
    depends_on:
      postgres:
        condition: service_healthy
      ugajapa-bot:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ugajapa_pgdata_prod:
  ugajapa_model_cache_prod:
