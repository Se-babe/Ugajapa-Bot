services:
  postgres:
    image: postgres:16-alpine
    container_name: ugajapa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmuser_password}
      POSTGRES_DB: ${POSTGRES_DB:-ugajapa_api}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ugajapa_pgdata:/var/lib/postgresql/data
      - ./translation-api/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-ugajapa_api}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ugajapa-bot:
    build: ./ugajapa-bot
    container_name: ugajapa-bot
    restart: unless-stopped
    ports:
      - "${BOT_PORT:-8000}:8000"
    # Bot stays reachable on localhost for local plugin testing;
    # do not expose this publicly in production. The host-side port is
    # configurable (BOT_PORT) in case 8000 conflicts with something else on
    # the machine — the container's internal port stays 8000 regardless,
    # since other containers reach it via ugajapa-bot:8000 on the compose
    # network, not through this host mapping.
    volumes:
      - ugajapa_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  translation-api:
    build: ./translation-api
    container_name: ugajapa-translation-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - ./translation-api/.env
    environment:
      # Overrides the Dockerfile's baked-in NODE_ENV=production (needed for
      # Render) — local Postgres has no SSL, so production mode there makes
      # every DB connection fail. Render sets its own NODE_ENV=production at
      # the platform level, which takes precedence over this image regardless.
      NODE_ENV: development
      PORT: 5000 # container-internal port; change API_PORT above to remap the host side
      DATABASE_URL: postgresql://${POSTGRES_USER:-mmuser}:${POSTGRES_PASSWORD:-mmuser_password}@postgres:5432/${POSTGRES_DB:-ugajapa_api}
      BOT_URL: http://ugajapa-bot:8000
      # ADMIN_EMAIL / ADMIN_PASSWORD intentionally NOT overridden here —
      # translation-api/.env (loaded via env_file above) is the single
      # source of truth for these. An explicit override here previously
      # shadowed that file with the root .env's stale defaults.
    depends_on:
      postgres:
        condition: service_healthy
      ugajapa-bot:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ugajapa_pgdata:
  ugajapa_model_cache:
